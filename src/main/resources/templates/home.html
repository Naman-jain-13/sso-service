<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 2.5rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .card h1 { color: #333; margin-bottom: 1rem; }
        .card p { color: #666; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.6rem 1.5rem; background: #c0392b; color: #fff; border: none; border-radius: 4px; text-decoration: none; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #a93226; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome!</h1>
        <p>You are authenticated via SSO. Your JWT session is active.</p>
        <a href="/logout" class="btn">Logout</a>
    </div>
</body>
</html>
